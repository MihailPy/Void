[project]
name = "void"
dynamic = ["version"]
description = "Local deterministic-first AI assistant with tool and skill routing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=2.37.0",
    "playwright>=1.53.0",
    "pytest>=8.0.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.dynamic]
version = {attr = "void.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["void*"]
